# Reverse proxy for billfold.ddns.net/api -> api container (:8080)
# Place in /etc/nginx/sites-available/billfold and symlink to sites-enabled.

server {
    listen 80;
    server_name billfold.ddns.net;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    location /api/ready {
        proxy_pass http://127.0.0.1:8080/ready;
    }

    # certbot/Let's Encrypt will insert the 443 server block + redirect here
}

